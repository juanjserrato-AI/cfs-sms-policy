<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>CFS Prospect Radar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prospect Radar">
<meta name="theme-color" content="#0f131d">
<style>
  :root{
    --bg:#0f131d; --card:#181d2b; --card2:#1e2740; --ink:#eef1f8; --muted:#9aa6c2; --faint:#6d7793;
    --line:#2b3346; --blue:#6f89d1; --orange:#f6874b; --green:#39d98a; --amber:#f6c453;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    line-height:1.4;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px)}
  h1{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:14px 4px 10px;font-weight:800}
  .status{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .statusrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);display:inline-block;margin-right:7px;vertical-align:middle}
  .dot.live{background:var(--green);box-shadow:0 0 0 4px rgba(57,217,138,.18)}
  .dot.err{background:var(--orange)}
  .ctrl{display:flex;align-items:center;gap:12px;margin-top:12px}
  .ctrl label{font-size:13px;color:var(--muted);white-space:nowrap}
  input[type=range]{flex:1;accent-color:var(--blue)}
  .rad{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
  .toggles{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .tg{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--card2);border:1px solid var(--line);
    padding:7px 12px;border-radius:100px;cursor:pointer;user-select:none}
  .tg.on{background:var(--blue);border-color:var(--blue);color:#0f131d}
  .btn{display:inline-block;border:none;border-radius:100px;font-weight:800;font-size:15px;padding:14px 20px;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--blue);color:#0f131d;width:100%;margin-bottom:12px}
  .banner{position:sticky;top:6px;z-index:5;background:linear-gradient(135deg,var(--orange),#d05716);color:#fff;
    border-radius:12px;padding:14px 16px;margin-bottom:12px;font-weight:700;display:none;box-shadow:0 8px 24px -8px rgba(0,0,0,.6)}
  .banner.show{display:block;animation:pop .3s ease}
  @keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
  .banner b{display:block;font-size:19px;margin-bottom:2px}
  .hero{background:var(--card);border:1px solid var(--blue);border-radius:14px;padding:16px;margin-bottom:14px;display:none}
  .hero.show{display:block}
  .hero .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);font-weight:800}
  .hero .nm{font-size:22px;font-weight:800;margin:4px 0 2px;text-wrap:balance}
  .hero .mt{font-size:13px;color:var(--muted)}
  .hero .dist{font-size:34px;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums;margin:8px 0}
  .row2{display:flex;gap:10px;margin-top:8px}
  .row2 a{flex:1;text-align:center;text-decoration:none;background:var(--blue);color:#0f131d;font-weight:800;padding:13px;border-radius:100px;font-size:15px}
  .row2 a.call{background:var(--green)}
  .deliverbtn{margin-top:10px;width:100%;border:1px solid var(--green);background:transparent;color:var(--green);font-weight:800;font-size:14px;padding:12px;border-radius:100px;cursor:pointer;font-family:inherit}
  .deliverbtn.done{background:var(--green);color:#0f131d;border-color:var(--green)}
  .item .deliverbtn{margin-top:8px;padding:9px;font-size:13px}
  .list{list-style:none;padding:0;margin:0}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
  .item.cust{background:transparent;border-style:dashed;opacity:.85}
  .item .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .item .nm{font-weight:700;font-size:16px}
  .item .d{font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
  .item.cust .d{color:var(--faint)}
  .item .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .item .acts{display:flex;gap:8px;margin-top:10px}
  .item .acts a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:13.5px;padding:10px;border-radius:100px;background:var(--card2);color:var(--ink);border:1px solid var(--line)}
  .item .acts a.dir{background:var(--blue);color:#0f131d;border:none}
  .item .acts a.call{background:var(--green);color:#0f131d;border:none}
  .tagp{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin-right:6px}
  .tagc{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:6px}
  .empty{color:var(--faint);font-size:14px;text-align:center;padding:24px 10px}
  .note{color:var(--faint);font-size:11.5px;margin:14px 4px 0;line-height:1.5}
  /* lock screen */
  #lock{max-width:420px;margin:16vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center}
  #lock h2{color:var(--blue);font-size:18px;margin:0 0 4px}
  #lock p{color:var(--muted);font-size:13px;margin:0 0 18px}
  #lock input{width:100%;font-size:17px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;margin-bottom:12px;font-family:inherit}
  #lock .rem{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;margin:2px 0 16px}
  #lockErr{color:var(--orange);font-size:13px;min-height:18px;margin-bottom:8px}
</style>
</head>
<body>

  <div id="lock">
    <h2>🔒 CFS Prospect Radar</h2>
    <p>Enter your passcode to unlock the list.</p>
    <input id="pass" type="password" inputmode="text" autocomplete="off" placeholder="Passcode" enterkeyhint="go">
    <div id="lockErr"></div>
    <label class="rem"><input id="remember" type="checkbox" checked> Remember on this phone</label>
    <button class="btn primary" id="unlockBtn" style="width:100%;margin:0">Unlock</button>
  </div>

  <div id="app" style="display:none">
    <h1>CFS Prospect Radar</h1>
    <button class="btn primary" id="startBtn">▶ Start radar (allow location)</button>
    <div style="margin:-4px 0 14px;color:var(--muted);font-size:13px">You: <input id="rep" type="text" autocomplete="off" spellcheck="false" placeholder="your name" style="background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:14px;width:160px"></div>
    <div class="status">
      <div class="statusrow">
        <span><span class="dot" id="dot"></span><span id="stat">Not started</span></span>
        <span id="acc"></span>
      </div>
      <div class="ctrl">
        <label>Alert radius</label>
        <input type="range" id="radius" min="0.25" max="4" step="0.25" value="2">
        <span class="rad" id="radVal">2.0 mi</span>
      </div>
      <div class="toggles">
        <span class="tg on" id="tgSound">🔊 Sound</span>
        <span class="tg on" id="tgCust">📍 Show customers</span>
        <span class="tg" id="tgTest">🧪 Test ping</span>
        <span class="tg" id="tgHide">🙈 Hide delivered</span>
        <span class="tg" id="tgLog">✉️ Log deliveries</span>
        <span class="tg" id="tgLock">🔒 Lock</span>
      </div>
    </div>
    <div class="banner" id="banner"></div>
    <div class="hero" id="hero"></div>
    <ul class="list" id="list"></ul>
    <p class="note" id="footnote"></p>
  </div>

const el = id => document.getElementById(id);
let DATA = null;

// ---------- unlock / decrypt ----------
const b64 = b => Uint8Array.from(atob(b), c=>c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function decryptWith(pass){
  const key = await deriveKey(pass, b64(ENC.salt), ENC.iter);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function attempt(pass, remember){
  try{
    const data = await decryptWith(pass);
    DATA = data;
    if(remember){ try{ localStorage.setItem('cfs_radar_pass', pass); }catch(e){} }
    el('lock').style.display='none';
    el('app').style.display='block';
    boot();
    return true;
  }catch(e){ return false; }
}
el('unlockBtn').addEventListener('click', async ()=>{
  el('lockErr').textContent='Checking…';
  const ok = await attempt(el('pass').value.trim(), el('remember').checked);
  if(!ok) el('lockErr').textContent='Wrong passcode — try again.';
});
el('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') el('unlockBtn').click(); });

// ---------- radar app ----------
const R = 3958.8;
const rad = d => d*Math.PI/180;
function miles(a,b,c,d){
  const dlat=rad(c-a), dlng=rad(d-b);
  const x=Math.sin(dlat/2)**2 + Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dlng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function fmt(m){ return m<0.1 ? Math.round(m*5280)+' ft' : m.toFixed(m<10?1:0)+' mi'; }
function mapsUrl(p){ return 'https://maps.apple.com/?daddr='+p.lat+','+p.lng+'&q='+encodeURIComponent(p.name); }
function telUrl(ph){ return 'tel:'+(ph||'').replace(/[^0-9+]/g,''); }

let radius=2, soundOn=true, custOn=true;
const alerted=new Set();
let here=null, watchId=null, audioCtx=null, wakeLock=null, booted=false;

function beep(){
  if(!soundOn || !audioCtx) return;
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4,audioCtx.currentTime+0.03);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.6);
    o.start(); o.stop(audioCtx.currentTime+0.62);
  }catch(e){}
}
function announce(p){
  el('banner').innerHTML='<b>Prospect nearby — '+fmt(p._d)+'</b>'+p.name+' · '+p.city;
  el('banner').classList.add('show'); beep();
  if(navigator.vibrate) navigator.vibrate([200,80,200]);
  clearTimeout(announce._t); announce._t=setTimeout(()=>el('banner').classList.remove('show'),8000);
}
let delivered={}; try{ delivered=JSON.parse(localStorage.getItem('cfs_radar_delivered')||'{}'); }catch(e){ delivered={}; }
let hideDelivered = localStorage.getItem('cfs_hide_delivered')!=='0';
const pkey = p => p.name+'|'+p.city;
const escAttr = s => (''+s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hubDelivered = k => (DATA && DATA.delivered && DATA.delivered[k]) || null;
const isDelivered = k => !!(delivered[k] || hubDelivered(k));
function saveDelivered(){ try{ localStorage.setItem('cfs_radar_delivered', JSON.stringify(delivered)); }catch(e){} }
function markDelivered(k,on){ if(on){ delivered[k]={at:new Date().toISOString(),logged:false}; } else { delete delivered[k]; } saveDelivered(); render(); updateLogBtn(); }
function unlogged(){ return Object.keys(delivered).filter(k=>delivered[k] && !delivered[k].logged); }
function updateLogBtn(){ const n=unlogged().length; const b=el('tgLog'); if(b){ b.textContent='✉️ Log deliveries'+(n?' ('+n+')':''); b.classList.toggle('on', n>0); } }
function logDeliveries(){
  const ks=unlogged(); if(!ks.length) return;
  const rep=((localStorage.getItem('cfs_radar_rep')||'').trim());
  if(!rep){ const rin=el('rep'); if(rin) rin.focus(); alert('Enter your name at the top first, so deliveries are logged under you.'); return; }
  const to=(DATA&&DATA.deliver_to)||'juan.serrato@cfsloris.com';
  let body='CFS RADAR — invites hand-delivered in the field:\r\n\r\n';
  ks.forEach(k=>{ body+=k+' | '+delivered[k].at+' | '+rep+'\r\n'; });
  body+='\r\n(Auto-generated by the Prospect Radar. Do not edit.)';
  window.location.href='mailto:'+to+'?subject='+encodeURIComponent('CFS RADAR DELIVERED')+'&body='+encodeURIComponent(body);
  ks.forEach(k=>{ if(delivered[k]) delivered[k].logged=true; }); saveDelivered(); updateLogBtn(); render();
}
function deliverBtn(p){
  const k=pkey(p);
  if(hubDelivered(k) && !delivered[k]) return '<div class="deliverbtn done" style="cursor:default">✓ Invited '+String(hubDelivered(k)).slice(0,10)+' · logged</div>';
  if(delivered[k]) return '<button class="deliverbtn done" data-deliver="off" data-key="'+escAttr(k)+'">✓ Invited '+(delivered[k].at||'').slice(0,10)+' · tap to undo</button>';
  return '<button class="deliverbtn" data-deliver="on" data-key="'+escAttr(k)+'">✓ Mark invited (delivered)</button>';
}
function render(){
  if(!DATA) return;
  const prospects=DATA.prospects.map(p=>({...p,_d:here?miles(here.lat,here.lng,p.lat,p.lng):null}));
  if(here) prospects.sort((a,b)=>a._d-b._d);
  if(here){
    for(const p of prospects){
      const k=pkey(p);
      if(isDelivered(k)) continue;
      if(p._d<=radius && !alerted.has(k)){ alerted.add(k); announce(p); }
      else if(p._d>radius*1.3 && alerted.has(k)){ alerted.delete(k); }
    }
  }
  const vis = hideDelivered ? prospects.filter(p=>!isDelivered(pkey(p))) : prospects;
  const hero=el('hero'), n=vis[0];
  if(here && n){
    hero.classList.add('show');
    hero.innerHTML='<div class="lbl">Nearest prospect</div><div class="nm">'+n.name+'</div>'+
      '<div class="mt">'+(n.cuisine?n.cuisine+' · ':'')+n.city+', '+n.state+'</div>'+
      '<div class="dist">'+fmt(n._d)+'</div><div class="row2"><a href="'+mapsUrl(n)+'">Directions</a>'+
      (n.phone?'<a class="call" href="'+telUrl(n.phone)+'">Call</a>':'')+'</div>'+deliverBtn(n);
  } else hero.classList.remove('show');
  const list=el('list'); list.innerHTML='';
  let shown=vis.filter(p=>p._d!=null && p._d<=radius);
  if(shown.length===0) shown=vis.slice(0,12);
  for(const p of shown.slice(0,40)){
    const li=document.createElement('li'); li.className='item';
    li.innerHTML='<div class="top"><span class="nm"><span class="tagp">Prospect</span>'+p.name+'</span>'+
      '<span class="d">'+(p._d!=null?fmt(p._d):'—')+'</span></div>'+
      '<div class="sub">'+(p.cuisine?p.cuisine+' · ':'')+p.city+', '+p.state+'</div>'+
      '<div class="acts"><a class="dir" href="'+mapsUrl(p)+'">Directions</a>'+
      (p.phone?'<a class="call" href="'+telUrl(p.phone)+'">Call</a>':'')+'</div>'+deliverBtn(p);
    list.appendChild(li);
  }
  if(custOn && here){
    const custs=DATA.customers.map(c=>({...c,_d:miles(here.lat,here.lng,c.lat,c.lng)}))
      .filter(c=>c._d<=radius).sort((a,b)=>a._d-b._d).slice(0,15);
    for(const c of custs){
      const li=document.createElement('li'); li.className='item cust';
      li.innerHTML='<div class="top"><span class="nm"><span class="tagc">Customer</span>'+c.name+'</span>'+
        '<span class="d">'+fmt(c._d)+'</span></div><div class="sub">'+c.city+', '+c.state+'</div>'+
        '<div class="acts"><a class="dir" href="'+mapsUrl(c)+'">Directions</a></div>';
      list.appendChild(li);
    }
  }
  if(list.children.length===0)
    list.innerHTML='<div class="empty">'+(here?'No stops within '+radius+' mi yet.':'Press Start to begin.')+'</div>';
}
async function keepAwake(){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
function onPos(pos){
  here={lat:pos.coords.latitude,lng:pos.coords.longitude};
  el('dot').className='dot live'; el('stat').textContent='Live · tracking';
  el('acc').textContent='±'+Math.round(pos.coords.accuracy)+' m'; render();
}
function onErr(err){
  el('dot').className='dot err';
  el('stat').textContent = err.code===1 ? 'Location blocked — allow it in Settings' : 'Location error: '+err.message;
}
function boot(){
  if(booted) return; booted=true;
  radius=parseFloat(localStorage.getItem('cfs_radius')||'2');
  soundOn=localStorage.getItem('cfs_sound')!=='0';
  custOn=localStorage.getItem('cfs_cust')!=='0';
  el('radius').value=radius; el('radVal').textContent=radius.toFixed(2).replace(/0$/,'')+' mi';
  el('tgSound').classList.toggle('on',soundOn);
  el('tgCust').classList.toggle('on',custOn);
  el('startBtn').addEventListener('click', async ()=>{
    try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
    keepAwake();
    if(!navigator.geolocation){ el('stat').textContent='Geolocation not supported'; return; }
    el('stat').textContent='Requesting location…';
    if(watchId!=null) navigator.geolocation.clearWatch(watchId);
    watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
    el('startBtn').textContent='● Radar running'; el('startBtn').style.opacity='.7';
  });
  el('radius').addEventListener('input',e=>{ radius=parseFloat(e.target.value); el('radVal').textContent=radius.toFixed(2).replace(/0$/,'')+' mi'; localStorage.setItem('cfs_radius',radius); render(); });
  el('tgSound').addEventListener('click',()=>{ soundOn=!soundOn; el('tgSound').classList.toggle('on',soundOn); localStorage.setItem('cfs_sound',soundOn?'1':'0'); });
  el('tgCust').addEventListener('click',()=>{ custOn=!custOn; el('tgCust').classList.toggle('on',custOn); localStorage.setItem('cfs_cust',custOn?'1':'0'); render(); });
  el('tgTest').addEventListener('click',()=>{ if(DATA&&DATA.prospects[0]) announce({...DATA.prospects[0],_d:0.2}); });
  el('tgLock').addEventListener('click',()=>{ try{ localStorage.removeItem('cfs_radar_pass'); }catch(e){} location.reload(); });
  updateLogBtn();
  el('tgHide').classList.toggle('on', hideDelivered);
  el('tgHide').addEventListener('click',()=>{ hideDelivered=!hideDelivered; el('tgHide').classList.toggle('on',hideDelivered); localStorage.setItem('cfs_hide_delivered', hideDelivered?'1':'0'); render(); });
  el('tgLog').addEventListener('click', logDeliveries);
  const rin=el('rep'); if(rin){ rin.value=(localStorage.getItem('cfs_radar_rep')||''); rin.addEventListener('input',()=>{ try{ localStorage.setItem('cfs_radar_rep', rin.value.trim()); }catch(e){} }); }
  el('app').addEventListener('click', e=>{ const b=e.target.closest('[data-deliver]'); if(!b) return; markDelivered(b.getAttribute('data-key'), b.getAttribute('data-deliver')==='on'); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && wakeLock===null) keepAwake(); });
  el('footnote').textContent='Keep this screen on while driving (wake-lock). '+DATA.prospects.length+' prospects · '+DATA.customers.length+' customers. Alerts fire for prospects only.';
  render();
}

// auto-unlock if remembered on this device
(function(){
  let saved=null; try{ saved=localStorage.getItem('cfs_radar_pass'); }catch(e){}
  if(saved) attempt(saved,false).then(ok=>{ if(!ok){ try{localStorage.removeItem('cfs_radar_pass');}catch(e){} el('pass').focus(); } });
  else el('pass').focus();
})();
</script>
