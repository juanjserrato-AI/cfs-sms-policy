/* ...and where a label DOES carry an accent, drop Ash for the whole label rather than
   splitting one word across two typefaces. Spanish is the primary language here. */
.noash{font-family:var(--sans)!important;font-weight:700;letter-spacing:-.01em}
:root{
  --ground:#f4f6fa; --surface:#fff; --surface-2:#eef2f9; --surface-3:#e4eaf4;
  --ink:#1f2940; --mute:#5b6780; --faint:#8592aa;
  --blue:#34508c; --blue-lift:#4762ad;
  --orange:#f36b26; --orange-deep:#d05716;
  --warn:#b3372a; --warn-bg:#fbeeec;
  --good:#2f7d5c; --good-bg:#eaf4ef;
  --rule:#dde3ee; --rule-soft:#e9edf5;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --shadow:0 1px 2px rgba(31,41,64,.07),0 6px 18px -12px rgba(31,41,64,.3);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131926; --surface:#1b2330; --surface-2:#222b3a; --surface-3:#2a3446;
  --ink:#e7ecf5; --mute:#9aa7bf; --faint:#77859e;
  --blue:#8ba5e0; --blue-lift:#a6bbea;
  --orange:#ff8347; --orange-deep:#ff9c6b;
  --warn:#e8867a; --warn-bg:#33211f;
  --good:#5cbf94; --good-bg:#172a23;
  --rule:#2c3648; --rule-soft:#242d3d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  --ground:#131926; --surface:#1b2330; --surface-2:#222b3a; --surface-3:#2a3446;
  --ink:#e7ecf5; --mute:#9aa7bf; --faint:#77859e;
  --blue:#8ba5e0; --blue-lift:#a6bbea;
  --orange:#ff8347; --orange-deep:#ff9c6b;
  --warn:#e8867a; --warn-bg:#33211f;
  --good:#5cbf94; --good-bg:#172a23;
  --rule:#2c3648; --rule-soft:#242d3d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.75);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.d{font-family:'Ash',var(--sans);font-weight:400}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- gate ---------- */
#gate{min-height:100dvh;display:grid;place-items:center;padding:26px 22px;background:linear-gradient(160deg,var(--blue-lift),var(--blue))}
.gcard{width:100%;max-width:380px;text-align:center;color:#fff}
.gcard svg{height:56px;width:auto;margin-bottom:20px}
.gcard .cfsl-a,.gcard .cfsl-b{fill:#fff}
.gcard h1{font-family:'Ash',var(--sans);font-weight:400;font-size:34px;margin:0 0 6px;line-height:1.05}
.gcard p{margin:0 0 26px;opacity:.85;font-size:14.5px}
.gin{display:flex;flex-direction:column;gap:11px}
.gin input{padding:15px 16px;border-radius:9px;border:0;font-size:17px;text-align:center;background:rgba(255,255,255,.95);color:#1f2940}
.gin button{padding:15px;border-radius:9px;border:0;background:var(--orange);color:#fff;font-size:16px;font-weight:600}
.grem{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:14px;opacity:.9}
.gerr{margin-top:14px;font-size:14px;color:#ffd9d2;min-height:20px}

/* ---------- chrome ---------- */
#top{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,var(--blue-lift),var(--blue));color:#fff;padding:11px 14px;padding-top:calc(11px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:11px}
#top .back{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;width:36px;height:36px;font-size:19px;line-height:1;flex:0 0 auto;display:grid;place-items:center}
#top .ttl{flex:1;min-width:0;font-family:'Ash',var(--sans);font-weight:400;font-size:clamp(15px,4.4vw,20px);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .lang{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:0 12px;height:36px;font-size:12.5px;font-weight:700;letter-spacing:.06em;flex:0 0 auto}
main{padding:16px 14px calc(30px + var(--safe-b));max-width:720px;margin:0 auto}

/* ---------- home ---------- */
.test{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--orange);border-radius:11px;padding:18px 18px 16px;box-shadow:var(--shadow);margin-bottom:18px}
.test .lab{font-family:'Ash',var(--sans);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-deep);margin-bottom:7px}
.test .q{font-size:18px;font-weight:600;line-height:1.38;margin:0 0 9px;letter-spacing:-.005em}
.test .nt{font-size:13.5px;color:var(--mute);margin:0}
.grid{display:grid;grid-template-columns:1fr;gap:9px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:14px 15px;text-align:left;box-shadow:var(--shadow);display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:14px;row-gap:3px;align-items:center;color:inherit;width:100%}
.card .ic{grid-row:1/3;grid-column:1;font-size:21px;color:var(--orange);line-height:1;text-align:center;align-self:center}
.card .nm{grid-column:2;font-family:'Ash',var(--sans);font-size:16px;line-height:1.15}
.card .bl{grid-column:2;font-size:13px;color:var(--mute);line-height:1.35}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule);font-size:12px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot button{background:none;border:0;color:var(--faint);font-size:12px;text-decoration:underline;padding:0}

/* ---------- shared blocks ---------- */
.blk{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:16px 17px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec-intro{font-size:14.5px;color:var(--mute);margin:0 0 14px;padding:0 2px}
h2.sh{font-family:'Ash',var(--sans);font-weight:400;font-size:17px;margin:0 0 9px}
.lab{font-family:'Ash',var(--sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--orange-deep);margin:0 0 7px}
ul.tick{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.tick li{font-size:14.5px;color:var(--mute);padding-left:17px;position:relative;line-height:1.45}
ul.tick li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.bad{margin-top:13px;background:var(--warn-bg);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--warn);line-height:1.42}
.bad b{font-family:'Ash',var(--sans);font-weight:400;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;display:block;margin-bottom:3px}
.src{font-size:11.5px;color:var(--faint);margin-top:10px;font-style:italic}

/* moves */
.mv .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.mv .n{font-family:'Ash',var(--sans);font-size:15px;color:var(--orange-deep);flex:0 0 auto}
.mv .nm{font-family:'Ash',var(--sans);font-size:19px}
.mv .say{font-size:16px;line-height:1.4;margin:0 0 13px;color:var(--ink)}

/* planner */
.pf{margin-bottom:13px}
.pf label{display:block;font-family:'Ash',var(--sans);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.pf input,.pf textarea{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.4}
.pf textarea{min-height:72px;resize:vertical}
.prow{display:flex;gap:9px;margin-top:4px}
.prow button{flex:1;padding:12px;border-radius:9px;border:1px solid var(--rule);background:var(--surface-2);color:var(--mute);font-size:14px;font-weight:600}
.prow button.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.saved{font-size:13px;color:var(--good);margin-top:9px;min-height:18px}

/* objections */
.obj .tag{display:inline-block;font-family:'Ash',var(--sans);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;background:var(--surface-3);color:var(--mute);padding:3px 9px;border-radius:5px;margin-bottom:9px}
.obj.hot .tag{background:var(--orange);color:#fff}
.obj .they{font-size:16.5px;font-weight:600;line-height:1.4;margin:0 0 9px}
.obj .why{font-size:13.5px;color:var(--mute);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin:0 0 13px;line-height:1.45}
.star{color:var(--orange);font-size:12px;margin-left:5px}

/* numbers */
.bar{display:flex;height:40px;border-radius:7px;overflow:hidden;border:1px solid var(--rule);margin-bottom:10px}
.bar div{display:grid;place-items:center;font-family:'Ash',var(--sans);font-size:11.5px;color:#fff;min-width:0;overflow:hidden}
.klist{display:grid;gap:6px;font-size:13px;color:var(--mute)}
.klist span{display:flex;align-items:center;gap:8px}
.klist i{font-style:normal;width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.klist b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink)}
.calc{display:grid;gap:10px}
.calc .cin{display:flex;align-items:center;gap:10px}
.calc .cin label{flex:1;font-size:14px;color:var(--mute)}
.calc .cin input{width:104px;padding:9px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.out{margin-top:6px;border-top:1px solid var(--rule);padding-top:12px;display:grid;gap:9px}
.out div{display:flex;align-items:baseline;gap:10px;font-size:14px;color:var(--mute)}
.out div b{margin-left:auto;font-family:'Ash',var(--sans);font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.out div.key b{color:var(--orange-deep)}
.fact{display:flex;gap:14px;align-items:flex-start}
.fact .bg{font-family:'Ash',var(--sans);font-size:30px;color:var(--blue-lift);line-height:1;flex:0 0 auto;min-width:64px;font-variant-numeric:tabular-nums}
.fact .tx b{display:block;font-family:'Ash',var(--sans);font-size:14.5px;margin-bottom:4px}
.fact .tx p{margin:0;font-size:13.5px;color:var(--mute);line-height:1.45}
table.seg{width:100%;border-collapse:collapse;font-size:14.5px}
table.seg td{padding:8px 0;border-bottom:1px solid var(--rule-soft);color:var(--mute)}
table.seg td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-family:'Ash',var(--sans)}
table.seg tr:last-child td{border-bottom:0}

/* styles / battle / ramp / tools */
.st .nm{font-family:'Ash',var(--sans);font-size:18px;margin-bottom:2px}
.st .as{font-size:13px;color:var(--orange-deep);margin-bottom:10px;font-weight:600}
.kv{display:grid;gap:8px;font-size:14px}
.kv div{display:grid;grid-template-columns:82px 1fr;gap:10px}
.kv dt{font-family:'Ash',var(--sans);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding-top:3px}
.kv dd{margin:0;color:var(--mute);line-height:1.42}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn);border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--warn);line-height:1.45;margin-bottom:14px}
.warnbox b{font-family:'Ash',var(--sans);font-weight:400;display:block;margin-bottom:4px;font-size:11px;letter-spacing:.11em;text-transform:uppercase}
.two{display:grid;gap:13px;margin-top:4px;min-width:0}
.two h3{font-family:'Ash',var(--sans);font-weight:400;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.ph{font-family:'Ash',var(--sans);font-size:16px;margin:0 0 4px}
.goal{font-size:13.5px;color:var(--mute);font-style:italic;margin:0 0 12px}
.certbox{background:var(--good-bg);border:1px solid var(--good);border-radius:10px;padding:15px 16px;margin-top:4px}
.certbox .lab{color:var(--good)}
.certbox p{margin:0;font-size:14px;color:var(--mute);line-height:1.5}
.when{font-size:12.5px;color:var(--orange-deep);font-weight:600;margin:0 0 9px}
.tip{margin-top:11px;font-size:13.5px;color:var(--mute);background:var(--surface-2);border-radius:8px;padding:10px 12px;line-height:1.45}


/* practice */
.pk{display:grid;gap:9px;margin-bottom:16px}
.pk button{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:14px 15px;text-align:left;box-shadow:var(--shadow);display:grid;gap:3px;color:inherit;width:100%}
.pk button.hot{border-left:4px solid var(--orange)}
.pk .nm{font-family:'Ash',var(--sans);font-size:16px;line-height:1.15}
.pk .bl{font-size:13px;color:var(--mute);line-height:1.35}
.pname{display:grid;gap:7px;margin-bottom:16px}
.pname label{font-family:'Ash',var(--sans);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute)}
.pname input{padding:11px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:16px;font-family:inherit}
.pname .hint{font-size:12.5px;color:var(--faint)}
.lgrp{display:flex;gap:8px;margin-bottom:18px}
.lgrp button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);color:var(--mute);font-size:14px;font-weight:600}
.lgrp button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
p.hint{font-size:12.5px;color:var(--faint);margin:-13px 0 18px;padding:0 2px;line-height:1.4}
/* the voice widget renders itself; reserve the space so the page does not jump
   when it finishes loading over a truck-stop connection */
#vhost{min-height:96px;margin-bottom:4px}
.situ{background:var(--surface-2);border-radius:9px;padding:13px 15px;font-size:14px;color:var(--mute);line-height:1.45;margin-bottom:14px}
.situ b{display:block;font-family:'Ash',var(--sans);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-deep);margin-bottom:5px}
.chat{display:grid;gap:9px;margin-bottom:14px}
.msg{max-width:86%;padding:11px 13px;border-radius:13px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.b{background:var(--surface);border:1px solid var(--rule);justify-self:start;border-bottom-left-radius:4px}
.msg.r{background:var(--blue);color:#fff;justify-self:end;border-bottom-right-radius:4px}
.msg.w{background:var(--surface-2);color:var(--faint);justify-self:start;font-style:italic}
.who{font-family:'Ash',var(--sans);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.cin{display:grid;gap:9px;position:sticky;bottom:0;background:var(--ground);padding:10px 0 calc(6px + var(--safe-b))}
.cin textarea{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:16px;min-height:62px;resize:vertical;line-height:1.4}
.crow{display:flex;gap:8px}
.crow button{padding:12px 14px;border-radius:9px;border:1px solid var(--rule);background:var(--surface-2);color:var(--mute);font-size:14px;font-weight:600}
.crow button.pri{flex:1;background:var(--orange);border-color:var(--orange);color:#fff}
.crow button:disabled{opacity:.5}
/* score card */
.sc-band{border-radius:11px;padding:17px 18px;margin-bottom:12px;color:#fff}
.sc-band.socio{background:var(--good)} .sc-band.solid{background:var(--blue)}
.sc-band.developing{background:var(--orange-deep)} .sc-band.needswork{background:var(--warn)}
.sc-band .bn{font-family:'Ash',var(--sans);font-size:24px;line-height:1}
.sc-band .tot{font-family:'Ash',var(--sans);font-size:14px;opacity:.9;margin-top:5px;font-variant-numeric:tabular-nums}
.sc-ceil{background:var(--warn);color:#fff;border-radius:9px;padding:13px 15px;margin-bottom:12px;font-size:14px;line-height:1.45}
.sc-ceil b{font-family:'Ash',var(--sans);font-weight:400;display:block;font-size:11px;letter-spacing:.12em;margin-bottom:4px}
.dim{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.dim:last-child{border-bottom:0}
.dim .v{font-family:'Ash',var(--sans);font-size:17px;min-width:46px;flex:0 0 46px;font-variant-numeric:tabular-nums;color:var(--blue)}
.dim .t b{display:block;font-size:14px;margin-bottom:2px}
.dim .t span{font-size:13px;color:var(--mute);line-height:1.4}
.pen{background:var(--warn-bg);border-radius:8px;padding:11px 13px;margin-bottom:8px;font-size:13.5px;color:var(--warn);line-height:1.45}
.pen b{font-family:'Ash',var(--sans);font-weight:400;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;display:block;margin-bottom:4px}
.pen q{display:block;margin-top:5px;font-style:italic;opacity:.85}
.rw{background:var(--good-bg);border:1px solid var(--good);border-radius:9px;padding:14px 16px;margin-top:12px}
.rw .lab{color:var(--good)}
.rw .no{font-size:13.5px;color:var(--mute);text-decoration:line-through;margin:0 0 8px}
.rw .yes{font-size:15px;color:var(--ink);margin:0;line-height:1.45}

/* links / videos */
.lk{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow);color:inherit;text-decoration:none;display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:13px;row-gap:3px;align-items:center}
.lk .n{grid-row:1/4;font-family:'Ash',var(--sans);font-size:13px;color:var(--orange-deep);text-align:center;align-self:center;font-variant-numeric:tabular-nums}
.lk .t{grid-column:2;font-weight:640;font-size:15px;line-height:1.3}
.lk .d{grid-column:2;font-size:13px;color:var(--mute);line-height:1.4}
.lk .m{grid-column:2;font-family:'Ash',var(--sans);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.lk:active{background:var(--surface-2)}
.notebox{background:var(--surface-2);border-radius:9px;padding:11px 13px;font-size:13.5px;color:var(--mute);line-height:1.45;margin-bottom:14px}

/* Ivan's verbatim -- visually distinct so a rep always knows whose words these are */
.ivan{background:var(--surface-2);border-left:3px solid var(--good);border-radius:0 9px 9px 0;padding:13px 15px;margin:0 0 12px}
.ivan .who{font-family:'Ash',var(--sans);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--good);margin-bottom:6px}
.ivan .said{font-size:16px;line-height:1.45;color:var(--ink);margin:0}
.ivan .note{font-size:13.5px;color:var(--mute);line-height:1.45;margin:9px 0 0;padding-top:9px;border-top:1px solid var(--rule)}
.coachtag{display:inline-block;font-family:'Ash',var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);padding:2px 7px;border-radius:4px;margin-left:7px;vertical-align:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

}

/* Any element set in Ash whose own text carries a character Ash cannot draw gets the
   system sans instead -- the whole label, not just the letter. Runs after every render. */
const ASH_OK = /^[ -z]*$/;
function deAsh(root){
  if (!root) return;
  root.querySelectorAll('*').forEach(el => {
    if (el.children.length) return;                       // leaf text only
    const t = el.textContent || '';
    if (!t || ASH_OK.test(t)) return;
    const f = getComputedStyle(el).fontFamily || '';
    if (/^["']?Ash/.test(f)) el.classList.add('noash');
  });
}

function wireCalc(){
  const num = id => { const v = parseFloat((document.getElementById(id) || {}).value); return isFinite(v) ? v : NaN; };
  const money = v => '$' + v.toFixed(2);
  function calc(){
    const cs = num('c_case'), po = num('c_portions'), sd = num('c_sides'), mp = num('c_menu');
    const portion = (isFinite(cs) && isFinite(po) && po > 0) ? cs / po : NaN;
    const plate = isFinite(portion) ? portion + (isFinite(sd) ? sd : 0) : NaN;
    const fc = (isFinite(plate) && isFinite(mp) && mp > 0) ? (plate / mp) * 100 : NaN;
    const gp = (isFinite(plate) && isFinite(mp)) ? mp - plate : NaN;
    document.getElementById('o_portion').innerHTML = isFinite(portion) ? money(portion) : '&mdash;';
    document.getElementById('o_plate').innerHTML   = isFinite(plate)   ? money(plate)   : '&mdash;';
    document.getElementById('o_fc').innerHTML      = isFinite(fc)      ? fc.toFixed(1) + '%' : '&mdash;';
    document.getElementById('o_gp').innerHTML      = isFinite(gp)      ? money(gp)      : '&mdash;';
  }
  ['c_case','c_portions','c_sides','c_menu'].forEach(id => {
    const el = document.getElementById(id); if (el) el.addEventListener('input', calc);
  });
}

   as typed practice. So the rep talks to a real voice and is judged by one standard. */
const WIDGET_SRC = 'https://unpkg.com/@elevenlabs/convai-widget-embed';
let widgetLoading = null;

function loadWidget(){
  if (window.customElements && customElements.get('elevenlabs-convai')) return Promise.resolve(true);
  if (widgetLoading) return widgetLoading;
  widgetLoading = new Promise(res => {
    const s = document.createElement('script');
    s.src = WIDGET_SRC; s.async = true;
    s.onload = () => res(true);
    s.onerror = () => { widgetLoading = null; res(false); };
    document.head.appendChild(s);
  });
  return widgetLoading;
}

  h += '<div id="vhost"></div>';

       esc(u('v_done')) + '</button>' +

       '<div class="saved" id="verr"></div>';
  $('#main').innerHTML = h; deAsh($('#main'));
  document.getElementById('vback').addEventListener('click', () => { PR = null; section('practice'); });
  document.getElementById('vdone').addEventListener('click', collectVoiceScore);

  // the call starts now as far as the scorer is concerned: anything already in KV is
  // from a previous run and must not be shown as this call's result
  PR.startedAt = new Date().toISOString();

  loadWidget().then(ok => {
    const host = document.getElementById('vhost');
    if (!host) return;
    if (!ok) {
      host.innerHTML = '<div class="notebox">' + esc(u('v_offline')) + '</div>';
      return;
    }
    const w = document.createElement('elevenlabs-convai');
    w.setAttribute('agent-id', sc.agent);
    w.setAttribute('language', lang);
    // the temperament is a LEVEL NAME, not the text: the buyer's personality stays on
    // the agent, out of reach of a rep reading their own page
    w.setAttribute('dynamic-variables', JSON.stringify({
      temperament: PR.diff || 'normal', difficulty: PR.diff || 'normal',
      rep: PR.rep, scenario: sc.id, lang: lang
    }));
    host.appendChild(w);
  });
}

async function collectVoiceScore(){
  const u = k => UL(PR.s, k, PR.lang);
  const err = document.getElementById('verr');
  const btn = document.getElementById('vdone');
  if (btn) btn.disabled = true;
  if (err) { err.style.color = 'var(--mute)'; err.textContent = u('v_waiting'); }
  // ElevenLabs has to close the call and post the transcript, then the Worker scores it.
  // That is ~15-40s, so poll rather than ask the rep to come back later.
  for (let i = 0; i < 30; i++){
    try {
      const d = await post('/voice-result', { rep: PR.rep, since: PR.startedAt });
      // the Worker leaves a marker when scoring itself failed, so the rep is told to run
      // it again instead of being told we could not find their call
      if (d.error) { practiceVoiceError(u('error')); return; }
      if (!d.pending) { PR.done = true; renderScore(d); return; }
    } catch (e) {
      if (e.code === 'quota') { practiceVoiceError(u('quota')); return; }
    }
    await new Promise(r => setTimeout(r, 3000));
  }
  practiceVoiceError(navigator.onLine ? u('v_none') : u('v_offline'));
}

function practiceVoiceError(msg){
  const err = document.getElementById('verr');
  const btn = document.getElementById('vdone');
  if (btn) btn.disabled = false;
  if (err) { err.style.color = 'var(--warn)'; err.textContent = msg; }
}

function renderChat(){
  const { s, sc, lang } = PR;
  const u = k => UL(s, k, lang);
  let h = '<div class="situ"><b>' + esc(u('situation')) + '</b>' + esc(TL(sc.setting, lang)) + '</div>';
  h += '<p class="sec-intro">' + esc(u('youare')) + '</p><div class="chat" id="chat">';
  PR.msgs.forEach(m => {
    h += '<div class="msg ' + (m.role === 'assistant' ? 'b' : 'r') + '">' +
         (m.role === 'assistant' ? '<div class="who">' + esc(TL(PR.sc.name, PR.lang)) + '</div>' : '') +
         esc(m.content) + '</div>';
  });
  if (PR.busy) h += '<div class="msg w" id="waiting">…</div>';
  h += '</div>';
  if (!PR.done){
    h += '<div class="cin"><textarea id="ctx" placeholder="' + esc(u('yoursay')) + '"></textarea>' +
         '<div class="crow"><button type="button" class="pri" id="csend"' + (PR.busy ? ' disabled' : '') + '>' + esc(u('send')) + '</button>' +
         '<button type="button" id="cfin"' + (PR.msgs.length < 4 ? ' disabled' : '') + '>' + esc(u('finish')) + '</button></div>' +
         '<div class="saved" id="cerr"></div></div>';
  }
  $('#main').innerHTML = h; deAsh($('#main'));
  const ta = document.getElementById('ctx');
  if (ta) {
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendTurn(); }
    });
    ta.focus();
  }
  const sb = document.getElementById('csend'); if (sb) sb.addEventListener('click', sendTurn);
  const fb = document.getElementById('cfin'); if (fb) fb.addEventListener('click', finishRoleplay);
  const c = document.getElementById('chat');
  if (c) window.scrollTo(0, document.body.scrollHeight);
}

async function post(path, payload){
  const r = await fetch(PR.s.worker + path, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-academy-pass': (function(){ try { return localStorage.getItem('cfsway_pass') || SESSION_PASS; } catch(e){ return SESSION_PASS; } })() },
    body: JSON.stringify(payload)
  });
  const d = await r.json().catch(() => ({ error: 'bad response' }));
  if (!r.ok) { const e = new Error(d.error || 'error'); e.code = d.error; throw e; }
  return d;
}

function practiceError(e){
  const u = k => UL(PR.s, k, PR.lang);
  const box = document.getElementById('cerr');
  const msg = (e && e.code === 'quota') ? u('quota')
            : (!navigator.onLine ? u('offline') : u('error'));
  if (box) { box.style.color = 'var(--warn)'; box.textContent = msg; }
}

async function sendTurn(){
  const ta = document.getElementById('ctx');
  const text = (ta && ta.value || '').trim();
  if (!text || PR.busy) return;
  PR.msgs.push({ role: 'user', content: text });
  PR.busy = true; renderChat();
  try {
    const d = await post('/chat', { rep: PR.rep, scenario: PR.sc.id, lang: PR.lang, difficulty: PR.diff, messages: PR.msgs });
    PR.msgs.push({ role: 'assistant', content: d.reply });
    PR.busy = false; renderChat();
  } catch (e) {
    PR.busy = false; PR.msgs.pop(); renderChat();
    practiceError(e);
    const ta2 = document.getElementById('ctx'); if (ta2) ta2.value = text;
  }
}

async function finishRoleplay(){
  const u = k => UL(PR.s, k, PR.lang);
  if (PR.msgs.length < 4) return;
  PR.busy = true;
  $('#main').innerHTML = '<div class="blk"><p style="margin:0;color:var(--mute)">' + esc(u('scoring')) + '</p></div>';
  try {
    const res = await post('/score', { rep: PR.rep, scenario: PR.sc.id, lang: PR.lang, difficulty: PR.diff, transcript: PR.msgs });
    PR.busy = false; PR.done = true;
    renderScore(res);
  } catch (e) {
    PR.busy = false; renderChat(); practiceError(e);
  }
}

function renderScore(res){
  killWidget();
  const s = PR.s, u = k => UL(s, k, PR.lang);
  const bandName = { socio: 'Socio', solid: 'Solid', developing: 'Developing', needswork: 'Needs Work' };
  const dimName = {
    prep:      { en: 'Preparation & Relevance', es: 'Preparación y relevancia' },
    trust:     { en: 'Trust & Empathy',         es: 'Confianza y empatía' },
    discovery: { en: 'Discovery Depth',         es: 'Profundidad del descubrimiento' },
    value:     { en: 'Value & Business Math',   es: 'Valor y números' },
    longterm:  { en: 'Long-Term Orientation',   es: 'Visión de largo plazo' },
    commit:    { en: 'Commitment & Follow-Through', es: 'Compromiso y cumplimiento' }
  };
  const penName = {
    pressure:   { en: 'Pressure Close',        es: 'Cierre a presión' },
    overpromise:{ en: 'Overpromise',           es: 'Promesa que no se cumple' },
    pricefirst: { en: 'Price-First',           es: 'Empezar por el precio' },
    assumed:    { en: 'Assumed the Need',      es: 'Suponer la necesidad' },
    pitchy:     { en: 'Pitch Over Listen',     es: 'Hablar más que escuchar' },
    rundown:    { en: 'Ran Down a Competitor', es: 'Hablar mal del competidor' },
    missed:     { en: 'Missed the Signal',     es: 'Ignorar la señal' }
  };
  const lg = PR.lang;
  const nm = (map, id) => (map[id] ? (map[id][lg] || map[id].en) : id);

  const dl = ((s.difficulties || []).find(x => x.id === PR.diff) || (s.difficulties || []).find(x => x.default));
  let h = '<div class="sc-band ' + esc(res.band) + '"><div class="bn">' + esc(bandName[res.band] || res.band) + '</div>' +
          '<div class="tot">' + esc(res.total) + ' / 24' +
          (dl ? ' &middot; ' + esc(TL(dl.name, PR.lang)) : '') + '</div></div>';
  if (res.ceiling_hit) {
    h += '<div class="sc-ceil"><b>' + esc(u('ceiling')) + '</b>' +
         esc(lg === 'es'
           ? 'Presionaste o prometiste algo que no se puede cumplir. Aunque el cliente haya dicho que sí, esta visita no pasa.'
           : 'You pressured or promised something we cannot keep. Even if the buyer said yes, this call does not pass.') +
         '</div>';
  }
  if (res.test) {
    h += '<div class="blk"><div class="lab">' + esc(u('test')) + '</div>' +
         '<p style="margin:0 0 6px;font-size:16px;font-weight:600">' + esc((res.test.verdict || '').toUpperCase()) + '</p>' +
         '<p style="margin:0;font-size:14px;color:var(--mute);line-height:1.5">' + esc(res.test.why || '') + '</p></div>';
  }
  h += '<div class="blk">';
  (res.dimensions || []).forEach(d => {
    h += '<div class="dim"><div class="v">' + esc(d.score) + '/4</div>' +
         '<div class="t"><b>' + esc(nm(dimName, d.id)) + '</b><span>' + esc(d.why || '') + '</span></div></div>';
  });
  h += '</div>';
  (res.penalties || []).forEach(p => {
    h += '<div class="pen"><b>' + esc(nm(penName, p.id)) + '</b>' + esc(p.why || '') +
         (p.quote ? '<q>“' + esc(p.quote) + '”</q>' : '') + '</div>';
  });
  if (res.one_thing) {
    h += '<div class="blk"><div class="lab">' + esc(u('onething')) + '</div>' +
         '<p style="margin:0;font-size:15.5px;line-height:1.5">' + esc(res.one_thing) + '</p></div>';
  }
  if (res.rewrite && res.rewrite.say) {
    h += '<div class="rw"><div class="lab">' + esc(u('insteadof')) + '</div>' +
         '<p class="no">' + esc(res.rewrite.instead_of || '') + '</p>' +
         '<div class="lab">' + esc(u('saythis')) + '</div>' +
         '<p class="yes">' + esc(res.rewrite.say) + '</p></div>';
  }
  h += '<div class="crow" style="margin-top:16px"><button type="button" class="pri" id="pagain">' + esc(u('again')) + '</button>' +
       '<button type="button" id="pback">' + esc(u('back')) + '</button></div>';
  $('#main').innerHTML = h; deAsh($('#main'));
  window.scrollTo(0, 0);
  document.getElementById('pagain').addEventListener('click', () => startRoleplay(PR.s, PR.sc.id, PR.rep, PR.lang, PR.diff, PR.mode));
  document.getElementById('pback').addEventListener('click', () => { PR = null; section('practice'); });
}

/* ---------- boot ---------- */
(function(){
  const saved = ls('cfsway_pass');
  if (saved) tryUnlock(saved, false).then(ok => { if (!ok) { try { localStorage.removeItem('cfsway_pass'); } catch(e){} $('#gpass').focus(); } });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>
